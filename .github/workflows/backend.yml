# CI/CD del backend (ADR-025, ADR-031) con controles DevSecOps (ADR-033)
# - En cada PR y push a main: pruebas + cobertura (JaCoCo), SonarCloud y Trivy (secretos y configuracion).
# - En cada PR: se construye la imagen y Trivy la escanea (no se publica).
# - En cada push a main: imagen escaneada con Trivy, subida a Artifact Registry y desplegada en Cloud Run (staging).
#   Si Trivy encuentra vulnerabilidades CRITICAS con arreglo disponible, la imagen NO se sube.
# - Produccion: a mano (Actions > Backend > Run workflow), con la imagen de un commit ya probado en staging.
#
# Configurar en GitHub (Settings > Secrets and variables > Actions):
#   Variables: GCP_PROYECTO, GCP_REGION (us-east1), GCP_INSTANCIA_SQL (agrotrack-db)
#              SONAR_ORGANIZACION, SONAR_PROYECTO_BACKEND (ver doc/devsecops.md)
#   Secretos:  GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_CUENTA_DESPLIEGUE
#              SONAR_TOKEN (sin el, el analisis de SonarCloud se salta y el resto sigue)
# Y los environments "staging" y "prod" (prod con aprobacion manual).
#
# Las acciones de terceros nuevas se fijan por SHA de commit, no por etiqueta (OWASP A08, ADR-033).
name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit (SHA completo) cuya imagen ya esta en staging y se pasa a produccion'
        required: true

env:
  IMAGEN_BASE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROYECTO }}/agrotrack/backend

jobs:
  pruebas:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # SonarCloud necesita la historia completa para saber que codigo es nuevo
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven
      - name: Pruebas y cobertura (JaCoCo)
        run: chmod +x mvnw && ./mvnw -B verify
      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
      - name: Analisis de calidad y seguridad (SonarCloud)
        if: env.SONAR_TOKEN != ''
        run: >
          ./mvnw -B sonar:sonar
          -Dsonar.organization=${{ vars.SONAR_ORGANIZACION }}
          -Dsonar.projectKey=${{ vars.SONAR_PROYECTO_BACKEND }}
      - name: Secretos expuestos y configuracion insegura (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          scanners: secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'

  imagen-pr:
    needs: pruebas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t agrotrack-backend:pr backend
      - name: Vulnerabilidades de la imagen (Trivy, informe)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agrotrack-backend:pr
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Bloquear si hay vulnerabilidades criticas con arreglo (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: agrotrack-backend:pr
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  staging:
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CUENTA_DESPLIEGUE }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Construir la imagen
        run: docker build -t "$IMAGEN_BASE:$GITHUB_SHA" backend
      - name: Vulnerabilidades de la imagen (Trivy, informe)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGEN_BASE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Bloquear si hay vulnerabilidades criticas con arreglo (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGEN_BASE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
      - name: Subir la imagen
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker push "$IMAGEN_BASE:$GITHUB_SHA"
      - name: Desplegar en Cloud Run (staging)
        env:
          GCP_PROYECTO: ${{ vars.GCP_PROYECTO }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_INSTANCIA_SQL: ${{ vars.GCP_INSTANCIA_SQL }}
          ENTORNO: staging
          IMAGEN: ${{ env.IMAGEN_BASE }}:${{ github.sha }}
        run: bash backend/despliegue/desplegar-cloud-run.sh

  produccion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_CUENTA_DESPLIEGUE }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Desplegar en Cloud Run (produccion)
        env:
          GCP_PROYECTO: ${{ vars.GCP_PROYECTO }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_INSTANCIA_SQL: ${{ vars.GCP_INSTANCIA_SQL }}
          ENTORNO: prod
          IMAGEN: ${{ env.IMAGEN_BASE }}:${{ inputs.commit }}
        run: bash backend/despliegue/desplegar-cloud-run.sh
