# Servidor propio con docker-compose (ADR-031). Secretos por variables de entorno (ADR-030)
spring.datasource.url=${AGROTRACK_DB_URL:jdbc:postgresql://localhost:5432/agrotrack}
spring.datasource.username=${AGROTRACK_DB_USUARIO:agrotrack}
spring.datasource.password=${AGROTRACK_DB_CLAVE}
spring.data.redis.host=${AGROTRACK_REDIS_HOST:localhost}
spring.data.redis.port=${AGROTRACK_REDIS_PUERTO:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=5m
springdoc.swagger-ui.enabled=false
