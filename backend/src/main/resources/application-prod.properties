# Google Cloud: Cloud Run + Cloud SQL (ADR-031). Secretos desde Secret Manager como variables de entorno (ADR-030).
# AGROTRACK_DB_URL usa el conector de Cloud SQL (sin IP publica), por ejemplo:
#   jdbc:postgresql:///agrotrack?cloudSqlInstance=PROYECTO:us-east1:agrotrack-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.url=${AGROTRACK_DB_URL}
spring.datasource.username=${AGROTRACK_DB_USUARIO:agrotrack}
spring.datasource.password=${AGROTRACK_DB_CLAVE}
# Cloud SQL pequeno admite pocas conexiones y Cloud Run puede tener hasta 3 instancias
spring.datasource.hikari.maximum-pool-size=5

springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Solo la salud queda publica; las metricas van a Cloud Monitoring (ADR-021)
management.endpoints.web.exposure.include=health
management.stackdriver.metrics.export.enabled=true
management.stackdriver.metrics.export.project-id=${AGROTRACK_GCP_PROYECTO}

# Logs en JSON para Cloud Logging, con el idTraza de cada peticion
logging.structured.format.console=logstash
logging.structured.json.rename.level=severity
