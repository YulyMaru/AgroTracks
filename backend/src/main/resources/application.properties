spring.application.name=agrotrack
# Perfil por defecto: postgres (PostgreSQL local, clave en AGROTRACK_DB_CLAVE).
# Otros perfiles: dev (H2 en archivo, sin instalar nada) y prod (Google Cloud: Cloud Run + Cloud SQL).
# Para elegir otro: variable de entorno SPRING_PROFILES_ACTIVE=dev (o prod).
spring.profiles.default=postgres

server.port=${PORT:8080}

# JPA: el esquema lo gobierna Flyway (ADR-019), Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.locations=classpath:db/migration

# Seguridad JWT (ADR-011, ADR-030). El secreto SIEMPRE por variable de entorno fuera de dev
agrotrack.seguridad.jwt-secreto=${AGROTRACK_JWT_SECRETO:dev-secreto-solo-para-desarrollo-cambiar-32bytes-min}
agrotrack.seguridad.access-token-minutos=15
agrotrack.seguridad.refresh-token-dias=30
# Encabezado que Cloudflare agrega a cada peticion (ADR-027). Vacio = no se exige (desarrollo)
agrotrack.seguridad.origen-secreto=${AGROTRACK_ORIGEN_SECRETO:}

# Cache en memoria (Caffeine) con vencimiento de 5 minutos (ADR-009)
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=5m

# Contrato estricto: un campo que la historia de usuario no define se rechaza con 400
# en lugar de ignorarse en silencio (evita perder datos que el movil si capturo).
spring.jackson.deserialization.fail-on-unknown-properties=true

# Sincronizacion
agrotrack.sincronizacion.max-operaciones-por-lote=100

# Observabilidad
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
# Las metricas solo se envian a Cloud Monitoring en produccion (ver application-prod.properties)
management.stackdriver.metrics.export.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html
