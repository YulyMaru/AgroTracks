# PostgreSQL local (ADR-013): la base real de desarrollo en este PC.
# Usa PostgreSQL 16 en el puerto 5432, base "agrotrack". Flyway crea las tablas al arrancar.
#
# La clave NO va aqui (ADR-030): se lee de la variable de entorno AGROTRACK_DB_CLAVE.
# Se pueden cambiar la URL y el usuario con AGROTRACK_DB_URL y AGROTRACK_DB_USUARIO.
spring.datasource.url=${AGROTRACK_DB_URL:jdbc:postgresql://localhost:5432/agrotrack}
spring.datasource.username=${AGROTRACK_DB_USUARIO:postgres}
spring.datasource.password=${AGROTRACK_DB_CLAVE:}

# Esquema explicito: si la base no tiene el esquema "public", Flyway lo crea. Sin esto, Flyway
# falla con "no se ha seleccionado ningun esquema dentro del cual crear".
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.jpa.properties.hibernate.default_schema=public
