# Desarrollo local sin PostgreSQL: H2 en modo compatible con PostgreSQL.
# La base se guarda en el archivo datos/agrotrack.mv.db (dentro de la carpeta del backend),
# asi los datos NO se pierden al reiniciar. Para empezar de cero, borra la carpeta datos/.
spring.datasource.url=jdbc:h2:file:./datos/agrotrack;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Consola web para ver los datos: http://localhost:8080/h2-console
# (JDBC URL: la misma de arriba; usuario sa; sin clave)
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
