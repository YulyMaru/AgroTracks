# Infraestructura para el perfil prod (ADR-013, ADR-031). Uso:
#   docker compose up -d
#   AGROTRACK_DB_CLAVE=agrotrack AGROTRACK_JWT_SECRETO=<32+ caracteres> SPRING_PROFILES_ACTIVE=prod ./mvnw spring-boot:run
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agrotrack
      POSTGRES_USER: agrotrack
      POSTGRES_PASSWORD: ${AGROTRACK_DB_CLAVE:-agrotrack}
    ports:
      - "5432:5432"
    volumes:
      - agrotrack-datos:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  agrotrack-datos:
