# Solo para DESARROLLO LOCAL: PostgreSQL 16, la misma version de Cloud SQL (ADR-013).
# En produccion la base es Cloud SQL de Google Cloud (ADR-031), no este archivo. Uso:
#   docker compose up -d
#   AGROTRACK_DB_USUARIO=agrotrack AGROTRACK_DB_CLAVE=agrotrack ./mvnw spring-boot:run   (perfil postgres)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agrotrack
      POSTGRES_USER: agrotrack
      POSTGRES_PASSWORD: ${AGROTRACK_DB_CLAVE:-agrotrack}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agrotrack-datos:/var/lib/postgresql/data

volumes:
  agrotrack-datos:
