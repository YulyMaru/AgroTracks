# SonarCloud de la app movil (ADR-033). La organizacion y la clave del proyecto llegan desde el pipeline.
sonar.host.url=https://sonarcloud.io
sonar.sources=src,App.tsx
sonar.tests=__tests__
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# El proyecto Android nativo y el script del logo no son codigo de la app
sonar.exclusions=android/**,scripts/**
