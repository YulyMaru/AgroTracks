# SonarCloud de la app movil (ADR-033). La organizacion y la clave del proyecto llegan desde el pipeline.
sonar.host.url=https://sonarcloud.io
sonar.sources=src,App.tsx
sonar.tests=__tests__
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# El proyecto Android nativo y el script del logo no son codigo de la app
sonar.exclusions=android/**,scripts/**
# Las pantallas se validan con E2E, usabilidad y pruebas en dispositivos (ADR-020, ADR-012), no con
# pruebas unitarias: no cuentan para la cobertura, pero si se analizan (bugs, seguridad, duplicacion).
sonar.coverage.exclusions=src/pantallas/**,src/navegacion/**,App.tsx
