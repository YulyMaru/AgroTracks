# Solo para las pruebas automaticas: base en memoria, separada de la base de desarrollo
# (datos/agrotrack.mv.db), para que las pruebas no mezclen datos con los del usuario.
# Este archivo en classpath:/config/ tiene prioridad sobre src/main/resources/application-dev.properties.
spring.datasource.url=jdbc:h2:mem:agrotrack-pruebas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.h2.console.enabled=false
